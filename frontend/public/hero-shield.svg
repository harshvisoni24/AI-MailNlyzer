<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300">
<defs>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a5f3fc"/><stop offset="0.45" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f3d8f"/><stop offset="0.55" stop-color="#0a2a66"/><stop offset="1" stop-color="#061738"/>
  </linearGradient>
  <radialGradient id="aura" cx="50%" cy="46%" r="50%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="0.55" stop-color="#2563eb" stop-opacity="0.22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.34"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="glowS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  <path id="sh" d="M160 34 L252 64 V146 C252 202 214 238 160 262 C106 238 68 202 68 146 V64 Z" stroke-linejoin="round"/>
</defs>

<!-- aura -->
<ellipse cx="160" cy="140" rx="150" ry="140" fill="url(#aura)"/>

<!-- ground rings -->
<g fill="none" stroke="url(#ring)">
  <ellipse cx="160" cy="246" rx="150" ry="30" stroke-width="1.2" opacity="0.55"/>
  <ellipse cx="160" cy="246" rx="118" ry="23" stroke-width="1.6" opacity="0.7"/>
  <ellipse cx="160" cy="246" rx="86" ry="16" stroke-width="2" opacity="0.85"/>
  <ellipse cx="160" cy="246" rx="54" ry="9" stroke-width="2.4"/>
</g>
<ellipse cx="160" cy="246" rx="70" ry="11" fill="#22d3ee" opacity="0.28" filter="url(#glow)"/>

<!-- light streaks -->
<g stroke="#67e8f9" stroke-linecap="round" opacity="0.5">
  <line x1="14" y1="176" x2="78" y2="152" stroke-width="1"/>
  <line x1="6" y1="130" x2="70" y2="124" stroke-width="0.8"/>
  <line x1="306" y1="168" x2="250" y2="150" stroke-width="1"/>
  <line x1="300" y1="110" x2="254" y2="112" stroke-width="0.8"/>
  <line x1="40" y1="212" x2="96" y2="196" stroke-width="0.8"/>
  <line x1="282" y1="208" x2="232" y2="196" stroke-width="0.8"/>
</g>
<g fill="#a5f3fc">
  <circle cx="30" cy="96" r="1.6" opacity="0.8"/><circle cx="52" cy="60" r="1.2" opacity="0.6"/>
  <circle cx="276" cy="70" r="1.8" opacity="0.8"/><circle cx="296" cy="146" r="1.2" opacity="0.7"/>
  <circle cx="24" cy="168" r="1.4" opacity="0.7"/><circle cx="86" cy="28" r="1.2" opacity="0.6"/>
  <circle cx="236" cy="30" r="1.4" opacity="0.7"/><circle cx="160" cy="12" r="1.6" opacity="0.8"/>
  <circle cx="110" cy="276" r="1.2" opacity="0.6"/><circle cx="214" cy="274" r="1.4" opacity="0.7"/>
</g>

<!-- shield glow + rim -->
<use href="#sh" fill="none" stroke="#22d3ee" stroke-width="12" opacity="0.8" filter="url(#glow)"/>
<use href="#sh" fill="url(#body)" stroke="url(#rim)" stroke-width="10"/>
<use href="#sh" fill="none" stroke="#e0f2fe" stroke-width="1.4" opacity="0.7" transform="translate(160 148) scale(0.93) translate(-160 -148)"/>
<path d="M76 70 L158 42 L158 150 C 120 150 92 128 76 96 Z" fill="url(#shine)"/>

<!-- envelope -->
<g fill="none" stroke="#7ce8ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <rect x="112" y="112" width="96" height="68" rx="9" filter="url(#glowS)" opacity="0.9"/>
  <path d="M116 120 L160 154 L204 120" filter="url(#glowS)" opacity="0.9"/>
</g>
<g fill="none" stroke="#e6fbff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="112" y="112" width="96" height="68" rx="9"/>
  <path d="M116 120 L160 154 L204 120"/>
</g>
</svg>
