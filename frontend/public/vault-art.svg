<ellipse cx="160" cy="150" rx="150" ry="110" fill="url(#aura)"/>
<g fill="none" stroke="#7dd3fc" opacity="0.55"><ellipse cx="160" cy="190" rx="150" ry="52" stroke-width="1"/><ellipse cx="160" cy="190" rx="115" ry="38" stroke-width="1.2"/></g>
